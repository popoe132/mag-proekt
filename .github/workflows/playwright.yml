name: Qase Tests
on:
  workflow_dispatch:
    inputs:
      qase_api_base_url:
        description: "Qase API URL"
        required: true
      qase_report:
        description: "Enabled/disabled reporting to Qase"
        required: true
      qase_project_code:
        description: "Qase project code"
        required: true
      qase_run_id:
        description: "Qase Run ID"
        required: false
      qase_run_complete:
        description: "Qase Run autocomplete"
        required: true
        

env:
  QASE_API_BASE_URL: ${{ inputs.qase_api_base_url }}
  QASE_TESTOPS_PROJECT: ${{ inputs.qase_project_code }}
  QASE_TESTOPS_RUN_ID: ${{ inputs.qase_run_id || '' }}
  QASE_TESTOPS_RUN_COMPLETE: false
  QASE_TESTOPS_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: cskmnrpt/qase-link-run@v2
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
    
      env:
          QASE_TESTOPS_API_TOKEN: ${{ env.QASE_TESTOPS_API_TOKEN }}
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test      
    - name: Complete Qase test run (if started from Qase)
      if: ${{ inputs.qase_run_id != '' }}
      uses: qase-tms/gh-actions/run-complete@v1
      with:
        token: ${{ secrets.QASE_API_TOKEN }}
        project: ${{ inputs.qase_project_code }}
        id: ${{ inputs.qase_run_id }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: test-results/
        retention-days: 30